spring.application.name=smart-office
server.port=${PORT:9067}

# MySQL - set these environment variables before running in production/GitHub clones.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_office?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT - replace in deployment with a long random secret (32+ characters).
smartoffice.jwt.secret=${JWT_SECRET:SmartOffice-Dev-Secret-Change-Me-2026-At-Least-32-Chars}
smartoffice.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# First-run admin. Override these environment variables before deployment.
smartoffice.admin.email=${ADMIN_EMAIL:admin@smartoffice.local}
smartoffice.admin.password=${ADMIN_PASSWORD:Admin@12345}
smartoffice.admin.name=${ADMIN_NAME:Smart Office Admin}
smartoffice.admin.phone=${ADMIN_PHONE:9999999999}

# Optional email notifications.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
smartoffice.notification.email=${NOTIFICATION_EMAIL:admin@smartoffice.local}

management.endpoints.web.exposure.include=health,info
