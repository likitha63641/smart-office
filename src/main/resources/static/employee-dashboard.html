<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dashboard | Smart Office</title>

    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            color: #1f2937;
        }

        /* =========================
           EMPLOYEE NAVIGATION
           ========================= */
        .nav {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav a,
        .nav button {
            color: #fff;
            text-decoration: none;
            background: none;
            border: 0;
            cursor: pointer;
            font-size: 15px;
            padding: 8px 10px;
        }

        .nav a:hover,
        .nav button:hover {
            opacity: 0.85;
        }

        .nav a.active {
            font-weight: 700;
            border-bottom: 2px solid #fff;
        }

        /* =========================
           PAGE CONTENT
           ========================= */
        .wrap {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        /* =========================
           HERO
           ========================= */
        .hero {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #fff;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .hero h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .hero p {
            margin-bottom: 0;
            opacity: 0.95;
        }

        /* =========================
           STATISTICS
           ========================= */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .card {
            background: #fff;
            padding: 22px;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
        }

        .num {
            font-size: 30px;
            font-weight: 800;
            margin-top: 8px;
        }

        /* =========================
           QUICK ACTIONS
           ========================= */
        .actions {
            margin: 25px 0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background: #2563eb;
            color: #fff;
            padding: 12px 17px;
            border-radius: 9px;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* =========================
           RECENT ISSUES
           ========================= */
        .list {
            background: #fff;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            padding: 22px;
        }

        .list h2 {
            margin-top: 0;
        }

        .issue {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .issue:last-child {
            border-bottom: none;
        }

        .issue-title {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .issue-meta {
            color: #6b7280;
            font-size: 14px;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 20px;
            background: #eef2ff;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            color: #3730a3;
        }

        /* =========================
           MOBILE
           ========================= */
        @media (max-width: 700px) {

            .nav {
                display: block;
                padding: 18px 5%;
            }

            .nav-brand {
                margin-bottom: 10px;
            }

            .nav-links {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
            }

            .nav a,
            .nav button {
                margin: 0;
                padding: 8px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .issue {
                align-items: flex-start;
            }
        }

        @media (max-width: 450px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }

            .issue {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div id="main-navigation"></div>


    <!-- ==========================================
         MAIN EMPLOYEE DASHBOARD
         ========================================== -->
    <div class="wrap">

        <!-- Welcome Section -->
        <div class="hero">

            <h1>
                Welcome,
                <span data-user-name>Employee</span>
                👋
            </h1>

            <p>
                Track your reported maintenance issues and their progress.
            </p>

        </div>


        <!-- ======================================
             EMPLOYEE ISSUE STATISTICS
             ====================================== -->
        <div class="stats">

            <div class="card">
                Total

                <div id="total" class="num">
                    0
                </div>
            </div>


            <div class="card">
                New

                <div id="newCount" class="num">
                    0
                </div>
            </div>


            <div class="card">
                Assigned

                <div id="assigned" class="num">
                    0
                </div>
            </div>


            <div class="card">
                Resolved

                <div id="resolved" class="num">
                    0
                </div>
            </div>

        </div>


        <!-- ======================================
             EMPLOYEE QUICK ACTIONS
             ====================================== -->
        <div class="actions">

            <a class="btn" href="/create-issue.html">
                ➕ Report New Issue
            </a>

            <a class="btn" href="/issues.html">
                📋 View My Issues
            </a>

            <a class="btn" href="/notifications.html">
                🔔 Notifications
            </a>

        </div>


        <!-- ======================================
             RECENT EMPLOYEE ISSUES
             ====================================== -->
        <div class="list">

            <h2>
                Recent Issues
            </h2>

            <div id="issues">
                Loading...
            </div>

        </div>

    </div>


    <!-- ==========================================
         AUTHENTICATION
         ========================================== -->
    <script src="/auth.js"></script>


    <script>

        /* ==============================
           LOGOUT
           ============================== */
        function logout() {
            smartLogout();
        }


        /* ==============================
           LOAD EMPLOYEE DASHBOARD DATA
           ============================== */
        async function load() {

            try {

                const response = await apiFetch('/issues');

                const list = await response.json();


                /* ==============================
                   ISSUE STATUS COUNTERS
                   ============================== */

                const counts = {
                    NEW: 0,
                    REVIEWED: 0,
                    ASSIGNED: 0,
                    IN_PROGRESS: 0,
                    RESOLVED: 0,
                    CLOSED: 0
                };


                list.forEach(issue => {

                    counts[issue.status] =
                        (counts[issue.status] || 0) + 1;

                });


                /* ==============================
                   UPDATE DASHBOARD STATISTICS
                   ============================== */

                document.getElementById('total').textContent =
                    list.length;


                document.getElementById('newCount').textContent =
                    counts.NEW + counts.REVIEWED;


                document.getElementById('assigned').textContent =
                    counts.ASSIGNED;


                document.getElementById('resolved').textContent =
                    counts.RESOLVED + counts.CLOSED;


                /* ==============================
                   RECENT ISSUES
                   ============================== */

                const issuesContainer =
                    document.getElementById('issues');


                if (!list.length) {

                    issuesContainer.innerHTML =
                        '<p>No issues reported yet.</p>';

                    return;
                }


                issuesContainer.innerHTML =
                    list
                        .slice(0, 8)
                        .map(issue => `

                            <div class="issue">

                                <div>

                                    <div class="issue-title">
                                        ${issue.title}
                                    </div>

                                    <div class="issue-meta">
                                        ${issue.category} · ${issue.priority}
                                    </div>

                                </div>

                                <a
                                    class="badge"
                                    href="/issue-details.html?id=${issue.id}"
                                >
                                    ${issue.status}
                                </a>

                            </div>

                        `)
                        .join('');

            } catch (error) {

                console.error(
                    'Failed to load employee dashboard:',
                    error
                );

                document.getElementById('issues').innerHTML =
                    '<p>Unable to load your issues right now.</p>';
            }
        }


        /* ==============================
           WAIT FOR AUTHENTICATION
           ============================== */

        document.addEventListener(
            'smartoffice-auth-ready',
            load
        );

    </script>
<script src="/javascript/nav.js"></script>
</body>
</html>
