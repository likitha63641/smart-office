<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Technicians | Smart Office</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* ================= NAVBAR ================= */

        .nav {
            height: 70px;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a,
        .nav-links button {
            color: white;
            text-decoration: none;

            padding: 10px 14px;

            border-radius: 8px;

            font-size: 14px;

            border: none;
            background: transparent;

            cursor: pointer;

            font-family: inherit;

            transition: 0.25s;
        }

        .nav-links a:hover,
        .nav-links button:hover {
            background: #1f2937;
        }

        .nav-links a.active {
            background: #2563eb;
            color: white;
        }


        /* ================= MAIN ================= */

        .container {
            width: 92%;
            max-width: 1250px;
            margin: 35px auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
            color: #111827;
        }

        .page-header p {
            color: #6b7280;
            margin-top: 5px;
        }


        /* ================= STATS ================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: white;

            padding: 22px;

            border-radius: 16px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 6px 22px rgba(15,23,42,0.07);

            transition: 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 28px rgba(15,23,42,0.11);
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;

            margin-top: 5px;

            color: #111827;
        }


        /* ================= FORM ================= */

        .form-card {
            background: white;

            border-radius: 18px;

            padding: 28px;

            margin-bottom: 30px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 8px 28px rgba(15,23,42,0.07);
        }

        .form-title {
            font-size: 20px;
            font-weight: 700;
        }

        .form-subtitle {
            color: #6b7280;
            font-size: 14px;

            margin-top: 5px;
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;

            margin-bottom: 7px;

            color: #374151;
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            background: white;

            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.1);
        }

        .availability-group {
            justify-content: flex-end;
        }


        /* ================= TOGGLE ================= */

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 12px;

            height: 43px;
        }

        .switch {
            position: relative;

            width: 48px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            background: #d1d5db;

            border-radius: 30px;

            cursor: pointer;

            transition: 0.25s;
        }

        .slider:before {
            content: "";

            position: absolute;

            width: 20px;
            height: 20px;

            left: 3px;
            top: 3px;

            background: white;

            border-radius: 50%;

            transition: 0.25s;

            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .switch input:checked + .slider {
            background: #2563eb;
        }

        .switch input:checked + .slider:before {
            transform: translateX(22px);
        }

        .availability-text {
            font-size: 14px;
            font-weight: 600;
        }


        /* ================= BUTTONS ================= */

        .form-actions {
            margin-top: 20px;

            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;

            padding: 12px 20px;

            border-radius: 9px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;

            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #eef2ff;
            color: #1d4ed8;
        }

        .btn-secondary:hover {
            background: #e0e7ff;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-small {
            padding: 9px 12px;
            font-size: 13px;
        }


        /* ================= MESSAGE ================= */

        .message {
            display: none;

            padding: 12px 15px;

            border-radius: 9px;

            margin-top: 15px;

            font-size: 14px;
        }

        .message.success {
            display: block;

            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;

            background: #fee2e2;
            color: #991b1b;
        }


        /* ================= TOOLBAR ================= */

        .toolbar {
            background: white;

            border-radius: 16px;

            padding: 18px;

            margin-bottom: 20px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 6px 22px rgba(15,23,42,0.06);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }

        .search-box {
            flex: 1;
        }

        .search-box input {
            width: 100%;

            padding: 12px 15px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            outline: none;

            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #2563eb;
        }

        .technician-count {
            color: #6b7280;

            font-size: 14px;

            white-space: nowrap;
        }


        /* ================= TECHNICIAN GRID ================= */

        .technician-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }

        .technician-card {
            background: white;

            border-radius: 18px;

            padding: 23px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 7px 25px rgba(15,23,42,0.07);

            transition: 0.25s;

            animation: fadeIn 0.35s ease;
        }

        .technician-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 32px rgba(15,23,42,0.12);
        }

        .technician-top {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 18px;
        }

        .avatar {
            width: 54px;
            height: 54px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #bfdbfe
                );

            color: #1d4ed8;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 21px;

            font-weight: 700;
        }

        .technician-name {
            font-size: 18px;

            font-weight: 700;

            color: #111827;
        }

        .technician-id {
            color: #6b7280;

            font-size: 12px;

            margin-top: 3px;
        }

        .technician-info {
            display: flex;

            flex-direction: column;

            gap: 9px;

            margin-bottom: 18px;
        }

        .info-row {
            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 14px;

            color: #4b5563;
        }

        .info-icon {
            width: 20px;

            text-align: center;
        }

        .specialization {
            display: inline-block;

            background: #eff6ff;

            color: #1d4ed8;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;
        }

        .availability {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;
        }

        .availability.available {
            background: #dcfce7;
            color: #166534;
        }

        .availability.busy {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: currentColor;
        }

        .card-actions {
            display: flex;

            gap: 8px;

            padding-top: 15px;

            border-top: 1px solid #f0f0f0;
        }

        .card-actions .btn {
            flex: 1;
        }


        /* ================= MODAL ================= */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(15, 23, 42, 0.55);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal-content {
            width: 100%;

            max-width: 600px;

            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.25);

            animation:
                modalIn 0.25s ease;
        }

        .modal-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 22px;
        }

        .modal-header h2 {
            color: #111827;
        }

        .close-btn {
            border: none;

            background: #f3f4f6;

            width: 35px;
            height: 35px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 18px;

            color: #4b5563;
        }

        .close-btn:hover {
            background: #e5e7eb;
        }

        .modal-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16px;
        }

        .modal-actions {
            margin-top: 22px;

            display: flex;

            justify-content: flex-end;

            gap: 10px;
        }


        /* ================= EMPTY STATE ================= */

        .empty-state {
            background: white;

            border-radius: 18px;

            padding: 60px 20px;

            text-align: center;

            border: 1px solid #e5e7eb;

            color: #6b7280;
        }

        .empty-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #374151;

            margin-bottom: 7px;
        }


        /* ================= LOADING ================= */

        .loading {
            background: white;

            border-radius: 18px;

            padding: 50px;

            text-align: center;

            color: #6b7280;

            border: 1px solid #e5e7eb;
        }

        .spinner {
            width: 35px;
            height: 35px;

            border: 4px solid #e5e7eb;

            border-top-color: #2563eb;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

            margin: 0 auto 15px;
        }


        /* ================= ANIMATIONS ================= */

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes modalIn {

            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 1000px) {

            .technician-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .nav {
                padding: 0 15px;
            }

            .nav-links a {
                display: none;
            }

            .nav-links button {
                display: block;
            }

            .container {
                width: 94%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .technician-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .technician-count {
                text-align: center;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

  <div id="main-navigation"></div>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <div>

                <h1>
                    Technician Management
                </h1>

                <p>
                    Manage technicians and their availability.
                </p>

            </div>

        </div>


        <!-- ================= STATS ================= -->

        <div class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">
                    👨‍🔧
                </div>

                <div class="stat-label">
                    Total Technicians
                </div>

                <div
                    class="stat-value"
                    id="totalTechnicians"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🟢
                </div>

                <div class="stat-label">
                    Available
                </div>

                <div
                    class="stat-value"
                    id="availableTechnicians"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🔴
                </div>

                <div class="stat-label">
                    Busy
                </div>

                <div
                    class="stat-value"
                    id="busyTechnicians"
                >
                    0
                </div>

            </div>

        </div>


        <!-- ================= ADD TECHNICIAN ================= -->

        <div class="form-card">

            <div class="form-title">
                Add New Technician
            </div>

            <div class="form-subtitle">
                Create a technician account and assign their specialization.
            </div>


            <form id="addTechnicianForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter technician name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="technician@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="phone"
                            placeholder="10-15 digit phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="specialization">
                            Specialization
                        </label>

                        <select
                            id="specialization"
                            required
                        >

                            <option value="">
                                Select specialization
                            </option>

                            <option value="Electrical">
                                Electrical
                            </option>

                            <option value="Plumbing">
                                Plumbing
                            </option>

                            <option value="HVAC">
                                HVAC
                            </option>

                            <option value="IT">
                                IT
                            </option>

                            <option value="Carpentry">
                                Carpentry
                            </option>

                            <option value="General Maintenance">
                                General Maintenance
                            </option>

                        </select>

                    </div>


                    <div class="form-group availability-group">

                        <label>
                            Availability
                        </label>

                        <div class="toggle-container">

                            <label class="switch">

                                <input
                                    type="checkbox"
                                    id="available"
                                    checked
                                >

                                <span class="slider"></span>

                            </label>

                            <span
                                class="availability-text"
                                id="availabilityText"
                            >
                                Available
                            </span>

                        </div>

                    </div>


                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="addButton"
                    >
                        ➕ Add Technician
                    </button>

                </div>


            </form>


            <div
                id="message"
                class="message"
            ></div>

        </div>


        <!-- ================= SEARCH ================= -->

        <div class="toolbar">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search technicians by name, email, phone or specialization..."
                >

            </div>

            <div
                class="technician-count"
                id="technicianCount"
            >
                0 technicians
            </div>

        </div>


        <!-- ================= TECHNICIAN LIST ================= -->

        <div id="technicianContainer">

            <div class="loading">

                <div class="spinner"></div>

                Loading technicians...

            </div>

        </div>


    </main>


    <!-- ================= EDIT MODAL ================= -->

    <div
        class="modal"
        id="editModal"
    >

        <div class="modal-content">


            <div class="modal-header">

                <h2>
                    Edit Technician
                </h2>

                <button
                    type="button"
                    class="close-btn"
                    onclick="closeEditModal()"
                >
                    ×
                </button>

            </div>


            <input
                type="hidden"
                id="editId"
            >


            <div class="modal-grid">


                <div class="form-group">

                    <label for="editName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="editName"
                    >

                </div>


                <div class="form-group">

                    <label for="editEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="editEmail"
                    >

                </div>


                <div class="form-group">

                    <label for="editPhone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="editPhone"
                    >

                </div>


                <div class="form-group">

                    <label for="editSpecialization">
                        Specialization
                    </label>

                    <select
                        id="editSpecialization"
                    >

                        <option value="">
                            Select specialization
                        </option>

                        <option value="Electrical">
                            Electrical
                        </option>

                        <option value="Plumbing">
                            Plumbing
                        </option>

                        <option value="HVAC">
                            HVAC
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="Carpentry">
                            Carpentry
                        </option>

                        <option value="General Maintenance">
                            General Maintenance
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Availability
                    </label>

                    <div class="toggle-container">

                        <label class="switch">

                            <input
                                type="checkbox"
                                id="editAvailable"
                            >

                            <span class="slider"></span>

                        </label>

                        <span
                            class="availability-text"
                            id="editAvailabilityText"
                        >
                            Busy
                        </span>

                    </div>

                </div>


            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeEditModal()"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="updateTechnician()"
                >
                    Save Changes
                </button>

            </div>


        </div>

    </div>


    <!-- ================= AUTH ================= -->

    <script src="/auth.js"></script>


    <script>

        /* =====================================================
           GLOBAL DATA
        ===================================================== */

        let technicians = [];


        /* =====================================================
           API HEADERS
        ===================================================== */

        function getHeaders() {

            return {
                "Content-Type": "application/json"
            };

        }


        /* =====================================================
           LOAD TECHNICIANS
        ===================================================== */

        async function loadTechnicians() {

            const container =
                document.getElementById(
                    "technicianContainer"
                );

            try {

                container.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading technicians...
                    </div>
                `;


                const response =
                    await fetch(
                        "/technicians",
                        {
                            method: "GET",
                            headers: getHeaders()
                        }
                    );


                const data =
                    await response
                        .json()
                        .catch(
                            () => []
                        );


                if (!response.ok) {

                    throw new Error(
                        data?.message ||
                        "Failed to load technicians"
                    );

                }


                technicians =
                    Array.isArray(data)
                        ? data
                        : (
                            Array.isArray(data?.technicians)
                                ? data.technicians
                                : []
                        );


                updateStats();

                renderTechnicians();


            } catch (error) {

                console.error(error);


                container.innerHTML = `
                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            Unable to load technicians
                        </h3>

                        <p>
                            ${escapeHtml(
                                error.message ||
                                "Something went wrong."
                            )}
                        </p>

                    </div>
                `;

            }

        }


        /* =====================================================
           UPDATE STATISTICS
        ===================================================== */

        function updateStats() {

            const total =
                technicians.length;


            const available =
                technicians.filter(
                    technician =>
                        technician.available === true
                ).length;


            const busy =
                total - available;


            document
                .getElementById(
                    "totalTechnicians"
                )
                .textContent =
                    total;


            document
                .getElementById(
                    "availableTechnicians"
                )
                .textContent =
                    available;


            document
                .getElementById(
                    "busyTechnicians"
                )
                .textContent =
                    busy;

        }


        /* =====================================================
           RENDER TECHNICIANS
        ===================================================== */

        function renderTechnicians(
            filteredTechnicians =
                technicians
        ) {

            const container =
                document.getElementById(
                    "technicianContainer"
                );


            document
                .getElementById(
                    "technicianCount"
                )
                .textContent =
                    `${filteredTechnicians.length} technician${filteredTechnicians.length === 1 ? "" : "s"}`;


            if (
                !filteredTechnicians.length
            ) {

                container.innerHTML = `
                    <div class="empty-state">

                        <div class="empty-icon">
                            👨‍🔧
                        </div>

                        <h3>
                            No technicians found
                        </h3>

                        <p>
                            Add a technician or change your search.
                        </p>

                    </div>
                `;

                return;

            }


            container.innerHTML = `

                <div class="technician-grid">

                    ${filteredTechnicians
                        .map(
                            technician =>
                                createTechnicianCard(
                                    technician
                                )
                        )
                        .join("")}

                </div>

            `;

        }


        /* =====================================================
           TECHNICIAN CARD
        ===================================================== */

        function createTechnicianCard(
            technician
        ) {

            const name =
                technician.name ||
                "Unknown Technician";


            const initials =
                name
                    .split(" ")
                    .filter(Boolean)
                    .slice(0, 2)
                    .map(
                        part =>
                            part.charAt(0)
                                .toUpperCase()
                    )
                    .join("");


            const available =
                technician.available === true;


            const availabilityClass =
                available
                    ? "available"
                    : "busy";


            const availabilityText =
                available
                    ? "Available"
                    : "Busy";


            return `

                <div class="technician-card">


                    <div class="technician-top">

                        <div class="avatar">
                            ${escapeHtml(initials || "?")}
                        </div>

                        <div>

                            <div class="technician-name">
                                ${escapeHtml(name)}
                            </div>

                            <div class="technician-id">
                                ID: ${escapeHtml(
                                    technician.id ?? "-"
                                )}
                            </div>

                        </div>

                    </div>


                    <div class="technician-info">


                        <div class="info-row">

                            <span class="info-icon">
                                ✉️
                            </span>

                            <span>
                                ${escapeHtml(
                                    technician.email ||
                                    "No email"
                                )}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-icon">
                                📞
                            </span>

                            <span>
                                ${escapeHtml(
                                    technician.phone ||
                                    "No phone"
                                )}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-icon">
                                🔧
                            </span>

                            <span class="specialization">
                                ${escapeHtml(
                                    technician.specialization ||
                                    "General Maintenance"
                                )}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="availability ${availabilityClass}">

                                <span class="status-dot"></span>

                                ${availabilityText}

                            </span>

                        </div>


                    </div>


                    <div class="card-actions">

                        <button
                            class="btn btn-secondary btn-small"
                            onclick="openEditModal(${JSON.stringify(technician.id)})"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="btn btn-danger btn-small"
                            onclick="deleteTechnician(${JSON.stringify(technician.id)})"
                        >
                            🗑️ Delete
                        </button>

                    </div>


                </div>

            `;

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        document
            .getElementById(
                "searchInput"
            )
            .addEventListener(
                "input",
                function() {

                    const query =
                        this.value
                            .trim()
                            .toLowerCase();


                    if (!query) {

                        renderTechnicians(
                            technicians
                        );

                        return;

                    }


                    const filtered =
                        technicians.filter(
                            technician => {

                                return [

                                    technician.name,

                                    technician.email,

                                    technician.phone,

                                    technician.specialization

                                ]
                                    .filter(Boolean)
                                    .some(
                                        value =>
                                            String(value)
                                                .toLowerCase()
                                                .includes(query)
                                    );

                            }
                        );


                    renderTechnicians(
                        filtered
                    );

                }
            );


        /* =====================================================
           AVAILABILITY TOGGLE
        ===================================================== */

        document
            .getElementById(
                "available"
            )
            .addEventListener(
                "change",
                function() {

                    document
                        .getElementById(
                            "availabilityText"
                        )
                        .textContent =
                            this.checked
                                ? "Available"
                                : "Busy";

                }
            );


        document
            .getElementById(
                "editAvailable"
            )
            .addEventListener(
                "change",
                function() {

                    document
                        .getElementById(
                            "editAvailabilityText"
                        )
                        .textContent =
                            this.checked
                                ? "Available"
                                : "Busy";

                }
            );


        /* =====================================================
           ADD TECHNICIAN
        ===================================================== */

        document
            .getElementById(
                "addTechnicianForm"
            )
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const button =
                        document.getElementById(
                            "addButton"
                        );


                    const name =
                        document
                            .getElementById(
                                "name"
                            )
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById(
                                "email"
                            )
                            .value
                            .trim();


                    const phone =
                        document
                            .getElementById(
                                "phone"
                            )
                            .value
                            .trim();


                    const specialization =
                        document
                            .getElementById(
                                "specialization"
                            )
                            .value
                            .trim();


                    const available =
                        document
                            .getElementById(
                                "available"
                            )
                            .checked;


                    if (
                        !name ||
                        !email ||
                        !phone ||
                        !specialization
                    ) {

                        showMessage(
                            "Please fill in all technician details.",
                            "error"
                        );

                        return;

                    }


                    if (
                        !isValidEmail(email)
                    ) {

                        showMessage(
                            "Please enter a valid email address.",
                            "error"
                        );

                        return;

                    }


                    if (
                        !isValidPhone(phone)
                    ) {

                        showMessage(
                            "Please enter a valid phone number.",
                            "error"
                        );

                        return;

                    }


                    try {

                        button.disabled =
                            true;

                        button.textContent =
                            "Adding...";


                        const response =
                            await fetch(
                                "/technicians",
                                {

                                    method: "POST",

                                    headers:
                                        getHeaders(),

                                    body:
                                        JSON.stringify({

                                            name:
                                                name,

                                            email:
                                                email,

                                            phone:
                                                phone,

                                            specialization:
                                                specialization,

                                            available:
                                                available

                                        })

                                }
                            );


                        const data =
                            await response
                                .json()
                                .catch(
                                    () => null
                                );


                        if (!response.ok) {

                            throw new Error(
                                data?.message ||
                                "Failed to add technician"
                            );

                        }


                        document
                            .getElementById(
                                "addTechnicianForm"
                            )
                            .reset();


                        document
                            .getElementById(
                                "available"
                            )
                            .checked =
                                true;


                        document
                            .getElementById(
                                "availabilityText"
                            )
                            .textContent =
                                "Available";


                        showMessage(
                            "Technician added successfully! ✅",
                            "success"
                        );


                        await loadTechnicians();


                    } catch (error) {

                        console.error(error);


                        showMessage(
                            error.message ||
                            "Unable to add technician.",
                            "error"
                        );


                    } finally {

                        button.disabled =
                            false;

                        button.textContent =
                            "➕ Add Technician";

                    }

                }
            );


        /* =====================================================
           EDIT MODAL
        ===================================================== */

        function openEditModal(id) {

            const technician =
                technicians.find(
                    item =>
                        item.id === id
                );


            if (!technician) {
                return;
            }


            document
                .getElementById(
                    "editId"
                )
                .value =
                    technician.id;


            document
                .getElementById(
                    "editName"
                )
                .value =
                    technician.name || "";


            document
                .getElementById(
                    "editEmail"
                )
                .value =
                    technician.email || "";


            document
                .getElementById(
                    "editPhone"
                )
                .value =
                    technician.phone
                        ? technician.phone
                        : "";


            document
                .getElementById(
                    "editSpecialization"
                )
                .value =
                    technician.specialization ||
                    "";


            document
                .getElementById(
                    "editAvailable"
                )
                .checked =
                    technician.available === true;


            document
                .getElementById(
                    "editAvailabilityText"
                )
                .textContent =
                    technician.available === true
                        ? "Available"
                        : "Busy";


            document
                .getElementById(
                    "editModal"
                )
                .style.display =
                    "flex";

        }


        function closeEditModal() {

            document
                .getElementById(
                    "editModal"
                )
                .style.display =
                    "none";

        }


        /* =====================================================
           UPDATE TECHNICIAN
        ===================================================== */

        async function updateTechnician() {

            const id =
                document
                    .getElementById(
                        "editId"
                    )
                    .value;


            const name =
                document
                    .getElementById(
                        "editName"
                    )
                    .value
                    .trim();


            const email =
                document
                    .getElementById(
                        "editEmail"
                    )
                    .value
                    .trim();


            const phone =
                document
                    .getElementById(
                        "editPhone"
                    )
                    .value
                    .trim();


            const specialization =
                document
                    .getElementById(
                        "editSpecialization"
                    )
                    .value
                    .trim();


            const available =
                document
                    .getElementById(
                        "editAvailable"
                    )
                    .checked;


            if (
                !name ||
                !email ||
                !phone ||
                !specialization
            ) {

                alert(
                    "Please fill in all technician details."
                );

                return;

            }


            if (!isValidEmail(email)) {

                alert(
                    "Please enter a valid email address."
                );

                return;

            }


            if (!isValidPhone(phone)) {

                alert(
                    "Please enter a valid phone number."
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        `/technicians/${id}`,
                        {

                            method: "PUT",

                            headers:
                                getHeaders(),

                            body:
                                JSON.stringify({

                                    name:
                                        name,

                                    email:
                                        email,

                                    phone:
                                        phone,

                                    specialization:
                                        specialization,

                                    available:
                                        available

                                })

                        }
                    );


                const data =
                    await response
                        .json()
                        .catch(
                            () => null
                        );


                if (!response.ok) {

                    throw new Error(
                        data?.message ||
                        "Failed to update technician"
                    );

                }


                closeEditModal();


                showMessage(
                    "Technician updated successfully! ✅",
                    "success"
                );


                await loadTechnicians();


            } catch (error) {

                console.error(error);


                alert(
                    error.message ||
                    "Unable to update technician."
                );

            }

        }


        /* =====================================================
           DELETE TECHNICIAN
        ===================================================== */

        async function deleteTechnician(id) {

            const technician =
                technicians.find(
                    item =>
                        item.id === id
                );


            if (!technician) {
                return;
            }


            const confirmed =
                confirm(
                    `Are you sure you want to delete "${technician.name}"?`
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/technicians/${id}`,
                        {

                            method: "DELETE",

                            headers:
                                getHeaders()

                        }
                    );


                const data =
                    await response
                        .json()
                        .catch(
                            () => null
                        );


                if (!response.ok) {

                    throw new Error(
                        data?.message ||
                        "Failed to delete technician"
                    );

                }


                showMessage(
                    "Technician deleted successfully. 🗑️",
                    "success"
                );


                await loadTechnicians();


            } catch (error) {

                console.error(error);


                showMessage(
                    error.message ||
                    "Unable to delete technician.",
                    "error"
                );

            }

        }


        /* =====================================================
           VALIDATION
        ===================================================== */

        function isValidEmail(email) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email);

        }


        function isValidPhone(phone) {

            const cleaned =
                phone.replace(
                    /[\s()+-]/g,
                    ""
                );

            return /^\d{10,15}$/
                .test(cleaned);

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.className =
                "message " + type;


            setTimeout(
                () => {

                    message.className =
                        "message";

                },
                4000
            );

        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        function logout() {

            smartLogout();

        }


        /* =====================================================
           CLOSE MODAL OUTSIDE CLICK
        ===================================================== */

        document
            .getElementById(
                "editModal"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeEditModal();

                    }

                }
            );


        /* =====================================================
           INITIAL LOAD
        ===================================================== */

        loadTechnicians();

    </script>


</body>

</html>
