<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Issues | Smart Office</title>

    <style>

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            color: #1f2937;
        }


        /* =========================
           COMMON ADMIN NAVIGATION
        ========================= */

        .nav {
            background: #111827;
            color: white;

            padding: 16px 5%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-sizing: border-box;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav a,
        .nav button {
            color: white;

            padding: 9px 12px;

            text-decoration: none;

            background: transparent;

            border: 0;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            font-family: inherit;

            transition: 0.2s ease;
        }

        .nav a:hover,
        .nav button:hover {
            background: #1f2937;
        }

        /* Active page */

        .nav a.active {
            background: #2563eb;
            color: white;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .wrap {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .btn {
            background: #2563eb;

            color: #fff;

            padding: 11px 15px;

            border-radius: 9px;

            text-decoration: none;

            border: 0;

            cursor: pointer;
        }

        .table {
            background: #fff;

            border-radius: 16px;

            border: 1px solid #e5e7eb;

            overflow: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;

            border-bottom: 1px solid #eee;

            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .badge {
            padding: 5px 9px;

            border-radius: 20px;

            background: #eef2ff;

            font-size: 12px;

            font-weight: 700;
        }

        .admin-tools {
            display: none;

            margin-bottom: 20px;
        }

        .error {
            padding: 20px;

            color: #991b1b;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .nav {
                flex-direction: column;

                gap: 12px;

                align-items: flex-start;
            }

            .nav-links {
                width: 100%;

                overflow-x: auto;

                padding-bottom: 3px;
            }
        }


        @media (max-width: 600px) {

            .nav {
                padding: 14px 4%;
            }

            .nav-links {
                gap: 3px;
            }

            .nav a,
            .nav button {
                padding: 8px 9px;

                font-size: 12px;
            }

            .head {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         COMMON ADMIN NAVIGATION
    ========================= -->

    <div class="nav">

        <div class="nav-brand">
            Smart Office · Admin
        </div>


        <div class="nav-links">

            <a href="/admin-dashboard.html">
                Dashboard
            </a>

            <a href="/issues.html"
               class="active">
                Issues
            </a>

            <a href="/employees.html">
                Employees
            </a>

            <a href="/technicians.html">
                Technicians
            </a>

            <a href="/categories.html">
                Categories
            </a>

            <a href="/notifications.html">
                Notifications
            </a>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <!-- =========================
         ISSUES CONTENT
    ========================= -->

    <div class="wrap">


        <div class="head">

            <div>

                <h1 id="heading">
                    My Issues
                </h1>

                <p id="sub">
                    Your reported maintenance issues.
                </p>

            </div>


            <a class="btn"
               href="/create-issue.html">

                + Report Issue

            </a>

        </div>


        <div id="adminTools"
             class="admin-tools">

            <button class="btn"
                    onclick="loadIssues()">

                Refresh All Issues

            </button>

        </div>


        <div class="table">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Title</th>

                        <th>Category</th>

                        <th>Employee</th>

                        <th>Priority</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="rows">

                    <tr>

                        <td colspan="7">
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="/auth.js"></script>


    <script>

        function logout() {

            smartLogout();

        }


        async function loadIssues() {

            try {

                const r =
                    await apiFetch('/issues');

                const list =
                    await r.json();


                const admin =
                    currentUser?.role === 'ADMIN';


                if (admin) {

                    heading.textContent =
                        'All Issues';

                    sub.textContent =
                        'Manage every maintenance request.';

                    adminTools.style.display =
                        'block';
                }


                rows.innerHTML =

                    list.map(i => `

                        <tr>

                            <td>
                                #${i.id}
                            </td>

                            <td>
                                ${i.title}
                            </td>

                            <td>
                                ${i.category}
                            </td>

                            <td>
                                ${i.employeeName ||
                                  i.reportedBy ||
                                  '-'}
                            </td>

                            <td>
                                ${i.priority}
                            </td>

                            <td>

                                <span class="badge">
                                    ${i.status}
                                </span>

                            </td>

                            <td>

                                <a href="/issue-details.html?id=${i.id}">
                                    Open
                                </a>

                            </td>

                        </tr>

                    `).join('')

                    ||

                    '<tr><td colspan="7">No issues found.</td></tr>';

            }

            catch (e) {

                rows.innerHTML =
                    '<tr><td colspan="7" class="error">Unable to load issues.</td></tr>';

            }

        }


        document.addEventListener(
            'smartoffice-auth-ready',
            loadIssues
        );

    </script>
<script src="/javascript/nav.js"></script>


</body>

</html>
