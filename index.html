<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Office | Login</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;margin:0;color:#1f2937}.wrap{min-height:100vh;display:grid;place-items:center;padding:25px}.card{width:min(430px,100%);background:#fff;border-radius:22px;padding:35px;box-shadow:0 18px 45px rgba(15,23,42,.12)}h1{color:#1d4ed8;margin:0 0 8px}.sub{color:#6b7280;margin-bottom:25px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;padding:11px;border:1px solid #dbe3ef;background:#f8fafc;border-radius:9px;cursor:pointer;font-weight:700}.tabs .active{background:#2563eb;color:white}.field{margin-bottom:15px}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;box-sizing:border-box}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:15px;padding:10px;border-radius:8px;display:none}.hint{font-size:12px;color:#6b7280;margin-top:18px;line-height:1.6}
</style></head>
<body><div class="wrap"><div class="card"><h1>Smart Office</h1><div class="sub">Issue & Maintenance Platform</div>
<div class="tabs"><button id="loginTab" class="active">Employee Login</button><button id="adminTab">Admin Login</button><button id="registerTab">Register</button></div>

<form id="loginForm">
  <div class="field"><label>Email</label><input id="loginEmail" type="email" required></div>
  <div class="field"><label>Password</label><input id="loginPassword" type="password" required></div>
  <button class="btn">Login</button>
</form>

<form id="registerForm" style="display:none">
  <div class="field"><label>Name</label><input id="name" required></div>
  <div class="field"><label>Email</label><input id="email" type="email" required></div>
  <div class="field"><label>Phone</label><input id="phone" pattern="[0-9]{10}" maxlength="10" required></div>
  <div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div>
  <button class="btn">Register</button>
</form>

<div id="msg" class="msg"></div>
<div class="hint"><b>Admin:</b> the first-run admin credentials come from <code>ADMIN_EMAIL</code> and <code>ADMIN_PASSWORD</code> environment variables.</div>
</div></div>

<script src="/auth.js"></script>
<script>
const loginTab = document.getElementById('loginTab'),
      adminTab = document.getElementById('adminTab'),
      registerTab = document.getElementById('registerTab'),
      loginForm = document.getElementById('loginForm'),
      registerForm = document.getElementById('registerForm'),
      msg = document.getElementById('msg');

let loginMode = 'USER';

function show(mode) {
  loginMode = mode === 'admin' ? 'ADMIN' : 'USER';
  loginForm.style.display = mode === 'register' ? 'none' : 'block';
  registerForm.style.display = mode === 'register' ? 'block' : 'none';
  loginTab.classList.toggle('active', mode === 'login');
  adminTab.classList.toggle('active', mode === 'admin');
  registerTab.classList.toggle('active', mode === 'register');
  msg.style.display = 'none';
}

loginTab.onclick = () => show('login');
adminTab.onclick = () => show('admin');
registerTab.onclick = () => show('register');

function message(t, error = true) {
  msg.textContent = t;
  msg.style.display = 'block';
  msg.style.background = error ? '#fee2e2' : '#dcfce7';
  msg.style.color = error ? '#991b1b' : '#166534';
}

async function submit(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.message || 'Request failed');
  return d;
}

loginForm.onsubmit = async e => {
  e.preventDefault();
  try {
    const d = await submit('/auth/login', {
      email: document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPassword').value
    });
    if (d.role !== loginMode) {
      throw new Error('This account belongs to the ' + d.role + ' side. Please use the correct login tab.');
    }
    location.href = d.role === 'ADMIN' ? '/admin-dashboard.html' : '/dashboard.html';
  } catch (err) {
    message(err.message);
  }
};

// FIXED: read fields with getElementById. The bare `name.value` was
// resolving to window.name (a string), so the name was never sent.
registerForm.onsubmit = async e => {
  e.preventDefault();
  try {
    await submit('/auth/register', {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      password: document.getElementById('password').value
    });
    location.href = '/dashboard.html';
  } catch (err) {
    message(err.message);
  }
};
</script></body></html>
