<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Issue Details | Smart Office</title><style>body{font-family:Segoe UI,Arial;background:#f4f7fb;margin:0;color:#1f2937}.nav{background:#2563eb;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.nav a,.nav button{color:#fff;margin-left:12px;text-decoration:none;background:none;border:0;cursor:pointer}.wrap{width:92%;max-width:1000px;margin:35px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:25px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.label{color:#6b7280;font-size:13px}.value{font-weight:700;margin-top:4px}.timeline{border-left:3px solid #2563eb;padding-left:18px}.event{margin:0 0 20px}.admin{display:none}.btn{background:#2563eb;color:#fff;padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.danger{background:#b91c1c}.msg{padding:10px;background:#dcfce7;color:#166534;border-radius:8px;display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div id="main-navigation"></div><div class="wrap"><div id="msg" class="msg"></div><div class="card"><h1 id="title">Loading...</h1><p id="description"></p><div class="grid"><div><div class="label">Category</div><div id="category" class="value"></div></div><div><div class="label">Priority</div><div id="priority" class="value"></div></div><div><div class="label">Status</div><div id="status" class="value"></div></div><div><div class="label">Reported By</div><div id="reportedBy" class="value"></div></div><div><div class="label">Technician</div><div id="technician" class="value"></div></div><div><div class="label">Attachment</div><div id="attachment" class="value"></div></div></div></div><div class="card admin" id="summaryCard"><h2>Incident Summary <button class="btn" onclick="copySummary()">Copy</button></h2><div id="summaryHead" style="font-weight:700;margin-bottom:10px"></div><pre id="summaryText" style="white-space:pre-wrap;font-family:inherit;margin:0"></pre></div><div class="card"><h2>Status Timeline</h2><div id="timeline" class="timeline">Loading...</div></div><div class="card admin" id="adminPanel"><h2>Admin Controls</h2><div class="grid"><div><label>New Status</label><select id="newStatus"><option>REVIEWED</option><option>ASSIGNED</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option></select><button class="btn" onclick="changeStatus()">Change Status</button></div><div><label>Technician</label><select id="tech"></select><button class="btn" onclick="assign()">Assign</button></div></div><br><button class="btn danger" onclick="deleteIssue()">Delete Issue</button></div></div><script src="/auth.js"></script><script>const id=new URLSearchParams(location.search).get('id');let issue;function logout(){smartLogout()}function show(t){msg.textContent=t;msg.style.display='block'}async function load(){const r=await apiFetch('/issues/'+id);issue=await r.json();if(!r.ok)throw new Error(issue.message||'Issue not found');title.textContent='#'+issue.id+' · '+issue.title;description.textContent=issue.description;category.textContent=issue.category;priority.textContent=issue.priority;document.getElementById('status').textContent=issue.status;reportedBy.textContent=issue.employeeName||issue.reportedBy||'-';technician.textContent=issue.technicianId?'Technician #'+issue.technicianId:'Not assigned';attachment.innerHTML=issue.attachmentName?`<a href="/${issue.attachmentPath}" target="_blank">${issue.attachmentName}</a>`:'None';const h=await apiFetch('/issues/'+id+'/history');const hs=await h.json();timeline.innerHTML=hs.map(x=>`<div class="event"><b>${x.newStatus}</b><div>${x.oldStatus?x.oldStatus+' → ':''}${x.newStatus}</div><small>${x.changedBy} · ${new Date(x.changedAt).toLocaleString()}</small></div>`).join('')||'<div>Issue created.</div>';if(currentUser?.role==='ADMIN'){adminPanel.style.display='block';const tr=await apiFetch('/technicians');const ts=await tr.json();tech.innerHTML=ts.map(t=>`<option value="${t.id}" ${!t.available?'disabled':''}>${t.name} · ${t.specialization} ${t.available?'(available)':'(busy)'}</option>`).join('');const sr=await apiFetch('/issues/'+id+'/summary');if(sr.ok){const sm=await sr.json();summaryHead.textContent=sm.headline;summaryText.textContent=sm.summary;summaryCard.style.display='block'}}}function copySummary(){navigator.clipboard.writeText(summaryHead.textContent+'\n\n'+summaryText.textContent).then(()=>show('Summary copied.'))}async function changeStatus(){const r=await apiFetch('/issues/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:newStatus.value})});const d=await r.json();if(!r.ok)show(d.message||'Unable to change status');else location.reload()}async function assign(){const r=await apiFetch('/issues/'+id+'/assign/'+tech.value,{method:'PUT'});const d=await r.json();if(!r.ok)show(d.message||'Unable to assign technician');else location.reload()}async function deleteIssue(){if(!confirm('Delete this issue?'))return;const r=await apiFetch('/issues/'+id,{method:'DELETE'});if(r.ok)location.href='/issues.html';else{const d=await r.json();show(d.message||'Delete failed')}}document.addEventListener('smartoffice-auth-ready',()=>load().catch(e=>show(e.message)));</script><script src="/javascript/nav.js"></script></body></html>
