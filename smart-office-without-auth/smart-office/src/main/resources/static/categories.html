<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories | Smart Office</title>

<style>

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        color: #1f2937;
    }


    /* =========================
       COMMON NAVIGATION BAR
    ========================= */

    .nav {
        background: #111827;
        color: white;

        padding: 16px 5%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        box-sizing: border-box;

        position: sticky;
        top: 0;
        z-index: 1000;
    }


    .nav-brand {
        font-size: 20px;
        font-weight: 700;
        white-space: nowrap;
    }


    .nav-links {
        display: flex;
        align-items: center;
        gap: 6px;
    }


    .nav a,
    .nav button {
        color: white;

        padding: 9px 12px;

        text-decoration: none;

        background: transparent;
        border: 0;

        border-radius: 7px;

        cursor: pointer;

        font-size: 14px;
        font-family: inherit;

        transition: 0.2s ease;
    }


    .nav a:hover,
    .nav button:hover {
        background: #1f2937;
    }


    /* Active page */

    .nav a.active {
        background: #2563eb;
        color: white;
    }


    /* =========================
       MAIN CONTENT
    ========================= */

    .wrap {
        width: 90%;
        max-width: 800px;
        margin: 35px auto;
    }


    .card {
        background: white;

        border: 1px solid #e5e7eb;

        border-radius: 15px;

        padding: 25px;

        margin-bottom: 20px;
    }


    .card h1 {
        margin-top: 0;
        margin-bottom: 20px;
    }


    /* =========================
       CATEGORY FORM
    ========================= */

    .row {
        display: flex;

        gap: 10px;

        margin-bottom: 10px;

        align-items: center;
    }


    .row input {
        flex: 1;

        padding: 10px;

        border: 1px solid #ddd;

        border-radius: 8px;

        font-family: inherit;

        font-size: 14px;

        box-sizing: border-box;
    }


    .row input:focus {
        outline: none;

        border-color: #2563eb;

        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }


    /* =========================
       BUTTONS
    ========================= */

    .btn {
        padding: 10px 13px;

        background: #2563eb;

        color: white;

        border: 0;

        border-radius: 8px;

        cursor: pointer;

        font-family: inherit;

        font-size: 14px;

        transition: 0.2s ease;
    }


    .btn:hover {
        background: #1d4ed8;
    }


    .danger {
        background: #b91c1c;
    }


    .danger:hover {
        background: #991b1b;
    }


    /* =========================
       CATEGORY LIST
    ========================= */

    .item {
        padding: 13px;

        border-bottom: 1px solid #eee;

        overflow: hidden;
    }


    .item:last-child {
        border-bottom: 0;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {

        .nav {
            flex-direction: column;

            gap: 12px;

            align-items: flex-start;
        }


        .nav-links {
            width: 100%;

            overflow-x: auto;

            padding-bottom: 3px;
        }

    }


    @media (max-width: 600px) {

        .nav {
            padding: 14px 4%;
        }


        .nav-links {
            gap: 3px;
        }


        .nav a,
        .nav button {
            padding: 8px 9px;

            font-size: 12px;
        }


        .wrap {
            width: 92%;

            margin: 25px auto;
        }


        .card {
            padding: 20px;
        }


        .row {
            flex-direction: column;

            align-items: stretch;
        }


        .row input {
            width: 100%;
        }


        .row .btn {
            width: 100%;
        }

    }

</style>
```

</head>

<body>

```
<div id="main-navigation"></div>


<!-- =========================
     MAIN CONTENT
========================= -->

<div class="wrap">


    <!-- ADD CATEGORY -->

    <div class="card">

        <h1>
            Manage Categories
        </h1>


        <form id="form" class="row">

            <input
                id="name"
                type="text"
                placeholder="Category name"
                required
            >


            <button
                type="submit"
                class="btn"
            >
                Add
            </button>

        </form>

    </div>


    <!-- CATEGORY LIST -->

    <div class="card">

        <div id="list">
            Loading...
        </div>

    </div>


</div>


<!-- =========================
     AUTHENTICATION
========================= -->

<script src="/auth.js"></script>


<script>


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        smartLogout();

    }


    /* =========================
       ELEMENTS
    ========================= */

    const form =
        document.getElementById("form");


    const nameInput =
        document.getElementById("name");


    const list =
        document.getElementById("list");


    /* =========================
       LOAD CATEGORIES
    ========================= */

    async function load() {

        try {

            const r =
                await apiFetch("/categories/all");


            if (!r.ok) {

                list.innerHTML =
                    "Could not load categories";

                return;

            }


            const cs =
                await r.json();


            list.innerHTML =

                cs.map(c => `

                    <div class="item">

                        <b>
                            ${c.name}
                        </b>

                        ·

                        ${c.active
                            ? "Active"
                            : "Inactive"
                        }


                        <button
                            class="btn danger"
                            style="float:right"
                            onclick="removeCat(${c.id})"
                        >
                            Delete
                        </button>

                    </div>

                `).join("")

                ||

                "No categories";


        } catch (error) {

            console.error(error);

            list.innerHTML =
                "Could not load categories";

        }

    }


    /* =========================
       DELETE CATEGORY
    ========================= */

    async function removeCat(id) {

        if (!confirm("Delete this category?")) {

            return;

        }


        try {

            const response =
                await apiFetch(
                    "/categories/" + id,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                alert(
                    "Could not delete category"
                );

                return;

            }


            await load();


        } catch (error) {

            console.error(error);

            alert(
                "Could not delete category"
            );

        }

    }


    /* =========================
       ADD CATEGORY
    ========================= */

    form.addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            const categoryName =
                nameInput.value.trim();


            if (!categoryName) {

                alert(
                    "Please enter a category name"
                );

                return;

            }


            try {

                const response =
                    await apiFetch(
                        "/categories",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name: categoryName,
                                active: true
                            })
                        }
                    );


                if (!response.ok) {

                    let message =
                        "Could not add category";


                    try {

                        const data =
                            await response.json();


                        message =
                            data.message || message;


                    } catch (error) {

                        console.error(error);

                    }


                    alert(message);

                    return;

                }


                /* Clear input */

                nameInput.value = "";


                /* Reload category list */

                await load();

            }


            catch (error) {

                console.error(error);

                alert(
                    "Could not add category"
                );

            }

        }
    );


    /* =========================
       LOAD AFTER AUTH
    ========================= */

    document.addEventListener(
        "smartoffice-auth-ready",
        load
    );


</script>
